global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: /metrics

  - job_name: vllm-big
    static_configs:
      - targets: ['vllm-big:8001']
    metrics_path: /metrics

  - job_name: vllm-small-0
    static_configs:
      - targets: ['vllm-small-0:8002']
    metrics_path: /metrics

  - job_name: vllm-small-1
    static_configs:
      - targets: ['vllm-small-1:8003']
    metrics_path: /metrics
